services:
  api:
    build:
      context: /home/jam/develop/honcho
      dockerfile: Dockerfile
    entrypoint:
    - sh
    - docker/entrypoint.sh
    depends_on:
      redis:
        condition: service_healthy
    ports:
    - 127.0.0.1:8000:8000
    healthcheck:
      test:
      - CMD
      - /app/.venv/bin/python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health',
        timeout=2).read()
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@postgres-local:5432/honcho
    - CACHE_URL=redis://redis:6379/0?suppress=true
    - CACHE_ENABLED=true
    - PYTHONIOENCODING=utf-8
    - PYTHONUTF8=1
    - LANG=C.UTF-8
    - LC_ALL=C.UTF-8
    env_file:
    - path: .env
      required: true
    restart: unless-stopped
    networks:
    - default
    - postgres-local_default
  deriver:
    build:
      context: /home/jam/develop/honcho
      dockerfile: Dockerfile
    entrypoint:
    - /app/.venv/bin/python
    - -m
    - src.deriver
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
    - DB_CONNECTION_URI=postgresql+psycopg://postgres:postgres@postgres-local:5432/honcho
    - CACHE_URL=redis://redis:6379/0?suppress=true
    - CACHE_ENABLED=true
    - PYTHONIOENCODING=utf-8
    - PYTHONUTF8=1
    - LANG=C.UTF-8
    - LC_ALL=C.UTF-8
    env_file:
    - path: .env
      required: true
    restart: unless-stopped
    networks:
    - default
    - postgres-local_default
  redis:
    image: redis:8.2
    restart: unless-stopped
    ports:
    - 127.0.0.1:6379:6379
    volumes:
    - redis-data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - redis-cli ping
      interval: 5s
      timeout: 5s
      retries: 5
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
    - 127.0.0.1:11434:11434
    volumes:
    - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: all
            capabilities:
            - gpu
    healthcheck:
      test:
      - CMD-SHELL
      - ollama --version || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  redis-data: null
  ollama-data: null
networks:
  postgres-local_default:
    external: true
